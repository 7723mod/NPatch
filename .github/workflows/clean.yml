name: Clean Build

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      # Runners are ephemeral, so local Gradle/ccache directories never survive a run; the only
      # state worth clearing lives in the repository's artifacts and Actions caches.
      - name: 清理 GitHub Actions artifacts 與快取
        uses: actions/github-script@v9
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { ...repo, per_page: 100 },
            );
            for (const artifact of artifacts) {
              core.info(`Deleting artifact ${artifact.id}: ${artifact.name}`);
              await github.rest.actions.deleteArtifact({ ...repo, artifact_id: artifact.id });
            }

            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { ...repo, per_page: 100 },
            );
            for (const cache of caches) {
              core.info(`Deleting cache ${cache.id}: ${cache.key}`);
              await github.rest.actions.deleteActionsCacheById({ ...repo, cache_id: cache.id });
            }
