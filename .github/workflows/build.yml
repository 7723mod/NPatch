name: CI Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ dev ]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 構建
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_HARDLINK: 'true'
      CCACHE_BASEDIR: '${{ github.workspace }}'

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: 設定快取
      uses: actions/cache@v6
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: 如果需要，則寫入簽名密鑰
      if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
      env:
        KEY_STORE: ${{ secrets.KEY_STORE }}
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEY_STORE" ]; then
          echo "androidStorePassword=$KEY_STORE_PASSWORD" >> gradle.properties
          echo "androidKeyAlias=$ALIAS" >> gradle.properties
          echo "androidKeyPassword=$KEY_PASSWORD" >> gradle.properties
          echo "androidStoreFile=key.jks" >> gradle.properties
          echo "$KEY_STORE" | base64 --decode > key.jks
        fi

    - name: 設定 Java
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: 設定 Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

    # Install exactly what the build pins (compileSdk/targetSdk 37, build-tools 37.0.0, NDK r29)
    # so Gradle never falls back to downloading SDK components mid-build.
    - name: 設定 Android SDK 37
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: 14742923
        packages: >-
          platform-tools
          platforms;android-37.0
          build-tools;37.0.0
          ndk;29.0.13846066

    - name: 設定 ninja
      uses: seanmiddleditch/gha-setup-ninja@master
      with:
        version: 1.12.1

    - name: 設定 CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.1.1'

    - name: 移除 Android 的 cmake
      shell: bash
      run: rm -rf "$ANDROID_HOME/cmake"

    - name: 授予 gradlew 執行權限
      run: chmod +x gradlew

    - name: 設定 commit id
      run: echo "commit=$(echo ${{ github.sha }} | cut -c-7)" >> $GITHUB_ENV

    - name: 使用 Gradle 構建
      run: ./gradlew buildAll

    - name: 上傳 Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: npatch-release-${{ env.commit }}
        path: out/release/*
        retention-days: 14

    - name: 上傳 Debug Artifact
      uses: actions/upload-artifact@v7
      with:
        name: npatch-debug-${{ env.commit }}
        path: out/debug/*
        retention-days: 7

    - name: 上傳 mappings
      uses: actions/upload-artifact@v7
      with:
        name: mappings-${{ env.commit }}
        path: |
          patch-loader/build/outputs/mapping
          manager/build/outputs/mapping

    - name: 上傳 symbols
      uses: actions/upload-artifact@v7
      with:
        name: symbols-${{ env.commit }}
        path: |
          patch-loader/build/symbols